# Immich Memories — self-hoster quickstart
# Usage: docker compose up -d
# Then open http://localhost:8080
# Authentication is disabled by default, so the UI is published on localhost only.
# Reaching it from another machine is a deliberate two-step change — see the ports block.
# The stateful UI supports one user flow in one replica.
#
# Resource requirements for THIS container:
#   Idle (UI):    ~100MB RAM
#   Preparation:  2-4GB RAM, 2+ cores (Immich previews, the ONNX heads, two CPU detectors)
#   Encoding:     4-8GB RAM, 4+ cores (FFmpeg assembly, depends on resolution)
#
# For GPU-accelerated title rendering or 4K output, increase limits.
# For GPU acceleration, see the hardware docs.
#
# Which mode this file starts in: no LLM model is set below, so the app cuts with
# its rules reader, and that one needs nothing outside this container. It gives
# you the ten standard memory types, cut from dates, places, favourites and known
# people. It is the degraded mode: it can skip an occasion or spend a slot on a
# mundane object, so look before you share, and custom free-text subjects are
# refused outright.
#
# The preparation tier below is pinned to no_captions, so this container is the
# whole stack: run `models fetch` inside it once (about 500 MB of pinned ONNX)
# and a cut finishes with no second service. Raise the tier to full for a caption
# under every picture, which wants a caption server, or drop it to metadata_only,
# which fetches nothing at all.
#
# For the model editor, which reads the period as a story and puts a reason under
# every picture, point LLM__BASE_URL and LLM__MODEL at a vision model you host:
# about 17 GB resident at 4-bit, on a second machine. See the self-hosting guide:
# https://sam-dumont.github.io/immich-video-memory-generator/docs/deploy/self-hosting
services:
  immich-memories:
    image: ghcr.io/sam-dumont/immich-video-memory-generator:latest
    container_name: immich-memories
    # Localhost only. This container holds an Immich API key to your whole library.
    # To reach it from other machines: turn on auth first, then use "8080:8080".
    # https://sam-dumont.github.io/immich-video-memory-generator/docs/deploy/configuration/authentication
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - immich-memories-config:/home/immich/.immich-memories
      - ./output:/app/output
    environment:
      IMMICH_URL: "${IMMICH_URL:-http://immich-server:2283}"
      IMMICH_API_KEY: "${IMMICH_API_KEY}"
      # Optional: session secret (auto-generated if not set; set to preserve sessions on restart)
      # IMMICH_MEMORIES_STORAGE_SECRET: "${IMMICH_MEMORIES_STORAGE_SECRET}"
      # The model editor's vision reader. Left unset, as it ships, the rules
      # reader cuts instead. Set both keys to switch.
      # "localhost" here means this container, so use a real hostname.
      # IMMICH_MEMORIES_LLM__BASE_URL: "http://your-model-box:8000/v1"
      # IMMICH_MEMORIES_LLM__MODEL: "mlx-community/Qwen3-VL-30B-A3B-Instruct-4bit"
      # Which producers this box pays for: full | no_captions | metadata_only.
      # Pinned here rather than left to the code default, which is full, so that
      # a first `up` with only IMMICH_URL and IMMICH_API_KEY set finishes a cut
      # with no second service. Given up against full: the caption per picture,
      # so the audience gate refuses what full refuses but can never clear a
      # unit, because eight findings are only named by a description. On a NAS
      # the first pass is 3h41 for a 10,793-picture library against 4 days on
      # full. Either tier wants `models fetch` run inside the container first;
      # metadata_only fetches nothing and cannot export as sendable.
      IMMICH_MEMORIES_EDITORIAL__PREPARATION__TIER: "no_captions"
      # Raise the tier to "full" with this, once a caption server answers.
      # The captioner profile below is one, and it is this compose network:
      # IMMICH_MEMORIES_EDITORIAL__PREPARATION__CAPTION_BASE_URL: "http://immich-memories-captioner:8092/v1"
      # Against a CPU captioner, ask for one picture at a time. Measured on 136
      # pictures: 36 s at 1, 461 s at the default 4, same server. Four image
      # encodes share the threads of one, and none of them finishes sooner.
      # IMMICH_MEMORIES_EDITORIAL__PREPARATION__CAPTION_CONCURRENCY: "1"
      # Optional: run the heads and detectors in the inference service below
      # instead of in this container (start it with --profile inference).
      # IMMICH_MEMORIES_INFERENCE__FACTS_BASE_URL: "http://immich-memories-inference:8092"
      # Optional: basic auth
      # IMMICH_MEMORIES_AUTH_USERNAME: "${IMMICH_MEMORIES_AUTH_USERNAME}"
      # IMMICH_MEMORIES_AUTH_PASSWORD: "${IMMICH_MEMORIES_AUTH_PASSWORD}"
      # Optional: daily automation inside the container (no host cron needed)
      # IMMICH_MEMORIES_AUTOMATION__ENABLED: "true"
      # IMMICH_MEMORIES_AUTOMATION__DAILY_AT: "09:00"
      # TZ: "Europe/Brussels"
    restart: unless-stopped
    # No CPU cap here on purpose. `cpus:` is a CFS quota, and a kernel built
    # without the CFS bandwidth controller refuses the container outright:
    # a Synology DS423+ on cgroup v1 answered `docker compose up` with
    # `NanoCPUs can not be set, as your kernel does not support CPU CFS
    # scheduler or the cgroup is not mounted`, so the NAS this file is aimed at
    # never started. Memory limits work everywhere, so those stay.
    # To cap the cores anyway, pick the form your kernel has:
    #   cpuset: "0-3"      # pin to four cores; works on cgroup v1 without CFS
    # or, under deploy.resources.limits, the quota form:
    #   cpus: "4"          # needs the CFS bandwidth controller
    deploy:
      resources:
        limits:
          memory: 4G

    # ── Intel Quick Sync / VAAPI hardware encoding (uncomment on Linux) ──
    # The image ships the VA-API drivers; what it cannot ship is access to your
    # GPU. Pass the render node through AND add the group that owns it — the
    # container runs as uid 1000, and /dev/dri/renderD128 is usually root:render
    # with no world access, so without group_add the device is there and
    # unopenable. The render GID differs per host (104 on Debian, 937 on
    # Synology DSM): `stat -c '%g' /dev/dri/renderD128` on the host prints yours.
    #
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "104"

    # ── Security hardening (uncomment for production) ──────────────────
    # Prevents privilege escalation, drops all capabilities, and makes
    # the root filesystem read-only. Writes go to tmpfs and volumes.
    #
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # read_only: true
    # tmpfs:
    #   - /tmp:size=2G
    #   - /home/immich/.cache:size=1G
    #
    # For 4K encoding, increase /tmp to 8G or remove the tmpfs entry
    # and let the container write to disk.

  # ── Optional: the inference service ───────────────────────────────────
  # The encoder, the six public heads and the two detectors behind one port,
  # with their own device variant — the shape immich-machine-learning has.
  # Behind a profile because the app runs those producers in process by default,
  # so starting it unasked would download ~500 MB of models nothing wants yet:
  #
  #   docker compose --profile inference up -d
  #   curl -s localhost:8092/health
  #
  # To make the app use it, uncomment IMMICH_MEMORIES_INFERENCE__FACTS_BASE_URL
  # in the app service above and restart it. The facts banked are the same rows
  # the in-process producers write, so turning it on or off re-derives nothing.
  #
  # No `extends:` here on purpose: compose resolves one when the file loads,
  # whatever profiles are on, so naming docker/hwaccel.inference.yml made a
  # downloaded docker-compose.yml fail to parse (#882). The cpu backend reserves
  # nothing, so there is nothing to inline for it; the cuda one is the commented
  # block at the end of this service. A checkout can use the overlay instead.
  immich-memories-inference:
    image: ghcr.io/sam-dumont/immich-video-memory-generator/inference:${INFERENCE_TAG:-latest}
    container_name: immich-memories-inference
    profiles:
      - inference
    # Localhost only, as with the UI. The service holds no credential, but it
    # will answer anything that reaches it.
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - immich-memories-model-cache:/cache
    environment:
      # A cold cache fetches the pinned encoder, the pinned Marqo export and the
      # Docling snapshot once, on first use.
      IMMICH_MEMORIES_INFERENCE_ALLOW_MODEL_DOWNLOADS: "true"
      # Everything huggingface_hub writes goes on the volume above. Left unset it
      # caches under $HOME, in the container's writable layer, and a recreate
      # downloads the lot again.
      HF_HOME: "/cache/huggingface"
      # Drop the weights after five idle minutes. The process stays up.
      IMMICH_MEMORIES_INFERENCE_IDLE_UNLOAD_SECONDS: "300"
    restart: unless-stopped
    # No CPU quota, for the same reason as the app service above: `cpuset: "0-3"`
    # is the form that starts on a kernel with no CFS bandwidth controller.
    deploy:
      resources:
        limits:
          memory: 4G
        # ── For a GPU: uncomment, and set INFERENCE_TAG=latest-cuda ────────
        # Both halves or neither. The cpu image has no CUDA provider in it and
        # will not grow one because a device was reserved, so the tag matters
        # as much as this block. /health then names CUDAExecutionProvider.
        #
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities:
        #         - gpu

  # ── Optional: the caption server ──────────────────────────────────────
  # `tier: full` writes one 140-token description under every picture, once,
  # and banks it. It needs an OpenAI-compatible endpoint that advertises
  # `smolvlm2-500m-base-public` at /models. Nothing else in this file provides
  # one, so here it is: llama.cpp serving the pinned SmolVLM2-500M GGUF under
  # that alias. Recipes for Apple Silicon and Kubernetes, and the whole
  # contract, are on docs/deploy/installation/caption-server.md.
  #
  #   docker compose --profile captioner up -d
  #   curl -s localhost:8092/v1/models
  #
  # Then set the tier to full and point the app at it (both lines above).
  #
  # This publishes host port 8092, which the inference profile publishes too.
  # Running both means changing one of the two left-hand sides; inside the
  # compose network they are different service names on the same port, so only
  # a curl from the host cares.
  #
  # On an NVIDIA host, run CAPTIONER_TAG=server-cuda and uncomment the two blocks
  # at the end of the serving service below. Measured: 3.5 s a picture on the CPU
  # image in a 2-CPU container, 0.08 to 0.23 s on a GPU. Both halves or neither,
  # as with the inference service: the cpu image has no CUDA in it. The two
  # services share the tag so the host pulls one llama.cpp image, not two.
  immich-memories-caption-models:
    image: ghcr.io/ggml-org/llama.cpp:${CAPTIONER_TAG:-server}
    container_name: immich-memories-caption-models
    profiles:
      - captioner
    # Pinned to one revision of ggml-org/SmolVLM2-500M-Video-Instruct-GGUF and
    # checked by digest, because llama-server takes whatever file is at the
    # path. `--model-url` is not the shortcut it looks like: build b10920
    # ignores it, starts in router mode with zero models, and /v1/models comes
    # back empty, which reads as "wrong model" rather than "no download".
    entrypoint: ["/bin/sh", "-euc"]
    # One list entry, not a block string: compose word-splits a string command,
    # so the script arrived as `sh -euc cd /models cat` and exited 0 having
    # downloaded nothing.
    command:
      - |
        cd /models
        {
          echo "6f67b8036b2469fcd71728702720c6b51aebd759b78137a8120733b4d66438bc  SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
          echo "921dc7e259f308e5b027111fa185efcbf33db13f6e35749ddf7f5cdb60ef520b  mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
        } > SHA256SUMS
        if sha256sum -c SHA256SUMS >/dev/null 2>&1; then
          echo "caption weights already present"
          exit 0
        fi
        base=https://huggingface.co/ggml-org/SmolVLM2-500M-Video-Instruct-GGUF/resolve/ccd7aae53bcb1997355c2f094959e72b3642ce17
        curl -fL --retry 3 -o SmolVLM2-500M-Video-Instruct-Q8_0.gguf "$$base/SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
        curl -fL --retry 3 -o mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf "$$base/mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
        sha256sum -c SHA256SUMS
    volumes:
      - immich-memories-caption-models:/models
    restart: "no"
    deploy:
      resources:
        limits:
          # curl streams the weights straight onto the volume and sha256sum
          # reads them back, so nothing here ever holds a model in memory.
          memory: 512M

  immich-memories-captioner:
    image: ghcr.io/ggml-org/llama.cpp:${CAPTIONER_TAG:-server}
    container_name: immich-memories-captioner
    profiles:
      - captioner
    depends_on:
      immich-memories-caption-models:
        condition: service_completed_successfully
    # Localhost only, as with the UI. The captioner holds no credential and
    # answers whatever reaches the port.
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - immich-memories-caption-models:/models:ro
    command:
      - "--model"
      - "/models/SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
      # Without the projector the model loads and serves the alias, blind:
      # the three synthetic control tiles fail and no picture is ever sent.
      - "--mmproj"
      - "/models/mmproj-SmolVLM2-500M-Video-Instruct-Q8_0.gguf"
      # The alias is the contract. The app refuses an endpoint that advertises
      # anything else at /models, whatever weights are behind it.
      - "--alias"
      - "smolvlm2-500m-base-public"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8092"
      # Already the default on build b10920. Named anyway, so the recipe keeps
      # working against a build where it is not.
      - "--jinja"
      - "--ctx-size"
      - "8192"
      # Threads, not a CPU quota: Synology's DSM kernel has no CFS bandwidth
      # controller, so `cpus:` fails there with `NanoCPUs can not be set`.
      - "--threads"
      - "4"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8092/health"]
      interval: 30s
      timeout: 5s
      # Weights load at boot, and a cold NAS takes a while over it.
      start_period: 180s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 1.4 GB resident with the weights mapped and an 8k context. It stays
          # on a card too: the weights are mapped in host memory before they are
          # copied to the device, and no kernel grew a CFS controller because a
          # GPU was attached, so there is still no `cpus:` here.
          memory: 3G
        # ── For a GPU: uncomment both blocks, and set CAPTIONER_TAG=server-cuda ──
        # A checkout can use docker/hwaccel.captioner.yml instead of copying them.
        # The layer count is an environment variable rather than a `--n-gpu-layers`
        # flag on the command above, because that list is also the alias, the
        # projector and the context size, and it should exist once. llama-server
        # reads LLAMA_ARG_N_GPU_LAYERS for the same setting; 99 is all of them.
        #
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities:
        #         - gpu
    # environment:
    #   LLAMA_ARG_N_GPU_LAYERS: "99"

volumes:
  immich-memories-config:
  immich-memories-model-cache:
  immich-memories-caption-models:
