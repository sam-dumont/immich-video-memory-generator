# Cache/state volume, mounted at /home/immich/.immich-memories: config.yaml,
# cache/annotations.sqlite, cache.db, downloads, thumbnails and preview clips.
# Also mounted at ~/.cache and /tmp through separate subPaths. Leave room for
# active downloads and FFmpeg intermediates beyond the configured cache caps.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-memories-cache
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: local-path
---
# Generated videos, mounted at /app/output.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-memories-output
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: local-path
---
# Pinned model artifacts, mounted at /models: the digest-checked DINOv2 export
# the pinned Marqo export and the document detector's Hugging Face cache. They are written by
# `immich-memories models fetch`; neither can live on the read-only root
# filesystem, and re-fetching them on every restart is 500 MB of nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-memories-models
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: local-path
