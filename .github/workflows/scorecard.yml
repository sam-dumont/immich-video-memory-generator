name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '25 7 * * 1'  # Weekly Monday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.repository == 'sam-dumont/immich-video-memory-generator'
    permissions:
      # A job-level block replaces the top-level read-all, so every read the
      # action needs has to be spelled out again here.
      security-events: write
      # OIDC token for publish_results (badge + api.scorecard.dev).
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Run analysis
        # v2.4.0 was the last release whose image lived on gcr.io, which now
        # refuses every pull with a billing error. v2.4.1+ ship from ghcr.io.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif
