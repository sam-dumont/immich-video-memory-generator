apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-memories
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-memories
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Inbound HTTP to the UI
    - ports:
        - port: 8080
          protocol: TCP

  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # HTTPS/HTTP outbound: Immich behind a reverse proxy, cloud LLM APIs, MusicGen
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

    # Immich server: 2283 on every Immich v2/v3 release. Change if yours differs.
    - ports:
        - port: 2283
          protocol: TCP

    # Optional: local LLM (Ollama default port) or an OpenAI-compatible server
    - ports:
        - port: 11434
          protocol: TCP
