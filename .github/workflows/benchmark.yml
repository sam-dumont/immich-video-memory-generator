# Benchmark persistence — track performance across CI runs and local machines
#
# Uses github-action-benchmark with actions/cache for historical comparison.
# Each runner (linux-ci, mac-local, synology, gpu-arc) gets its own cache
# namespace so results are compared against the same hardware.
#
# Flow:
#   CI (Linux):  push/PR → run benchmarks → compare against cache → PR comment
#   Local (Mac/Synology/etc.): `make benchmark-json && make benchmark-submit`
#       → workflow_dispatch → ingest results into runner-specific cache
#
# The benchmark-submit target dispatches results via GitHub API — no CI runner
# needed for Mac/Synology. Results land in separate cache namespaces.

name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "src/immich_memories/processing/**"
      - "src/immich_memories/analysis/**"
      - "src/immich_memories/titles/**"
      - "tests/integration/assembly/test_perf_*.py"
      - "tests/integration/titles/test_perf_*.py"
      - "tests/integration/assembly/perf_utils.py"
      - ".github/workflows/benchmark.yml"
      - "scripts/profile_pipeline.py"
      - "tests/performance/test_benchmark_contract.py"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "src/immich_memories/processing/**"
      - "src/immich_memories/analysis/**"
      - "src/immich_memories/titles/**"
      - "tests/integration/assembly/test_perf_*.py"
      - "tests/integration/titles/test_perf_*.py"
      - "tests/integration/assembly/perf_utils.py"
      - ".github/workflows/benchmark.yml"
      - "scripts/profile_pipeline.py"
      - "tests/performance/test_benchmark_contract.py"
      - "Makefile"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner name (e.g. mac-m4, synology-ds923, gpu-arc)"
        required: true
      suite:
        description: "Benchmark suite"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - assembly
          - titles
      sha:
        description: "Git SHA of the benchmarked commit"
        required: false
        default: ""
      results:
        description: "Full assembly benchmark JSON with reproduction metadata and three repetitions"
        required: true

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.inputs.runner || 'linux-ci' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── CI benchmarks (Linux only) ─────────────────────────────────────────────
  bench-linux:
    name: Benchmark (Linux CI)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # github-action-benchmark posts the regression comment on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Create LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS files
        run: git lfs pull

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          prune-cache: false
      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: make dev-test

      - name: Run assembly benchmarks
        run: make benchmark-assembly
        env:
          IMMICH_FORCE_CPU: "1"

      - name: Run title benchmarks
        run: make benchmark-titles-json
        env:
          IMMICH_FORCE_CPU: "1"

      - name: Validate assembly reproduction metadata
        run: |
          python3 -c "
          import json, sys
          from scripts.profile_pipeline import benchmark_comparison_projection
          try:
              projection = benchmark_comparison_projection(json.load(open('tests/perf-results.json')))
          except (OSError, ValueError, KeyError, TypeError, json.JSONDecodeError) as error:
              print(f'Invalid benchmark reproduction metadata: {error}', file=sys.stderr)
              sys.exit(1)
          open('tests/benchmark-results.json', 'w').write(json.dumps(projection, indent=2))
          print(f'Validated full reproduction metadata for {len(projection)} benchmark results')
          "

      - name: Record title comparison limitation
        run: echo "Title performance comparison is advisory-unavailable until it exports reproduction metadata."

      # WHY: restore BEFORE benchmark-action so it has historical data to compare against
      - name: Restore benchmark cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./cache
          key: benchmark-linux-ci-main-
          restore-keys: |
            benchmark-linux-ci-main-

      - name: Count comparable baseline runs
        id: baseline-count
        run: |
          python3 -c "
          import json
          from scripts.profile_pipeline import count_comparable_baselines
          try:
              data = json.load(open('./cache/benchmark-data.json'))
              current = json.load(open('tests/benchmark-results.json'))
              count = count_comparable_baselines(data, current)
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              count = 0
          open('$GITHUB_OUTPUT', 'a').write(f'count={count}\\nready={str(count >= 10).lower()}\\n')
          print(f'Comparable baseline runs: {count}; blocking alerts: {count >= 10}')
          "

      - name: Compare against baseline
        uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1
        with:
          tool: customSmallerIsBetter
          output-file-path: tests/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: "150%"
          # The preceding check counts comparable saved entries; ten enables blocking alerts.
          fail-on-alert: ${{ steps.baseline-count.outputs.ready == 'true' && github.event_name == 'pull_request' }}
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save benchmark cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./cache
          key: benchmark-linux-ci-main-${{ github.run_id }}

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: benchmark-linux-ci
          path: |
            tests/benchmark-*.json
            tests/perf-results.json
          retention-days: 90

  # ── Ingest results from local runners (Mac, Synology, GPU, etc.) ───────────
  ingest:
    name: Ingest (${{ github.event.inputs.runner }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A dispatched ingest has no PR to comment on; it only writes the cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate and project submitted results
        run: |
          cat <<'RESULTS_EOF' > tests/benchmark-results.json
          ${{ github.event.inputs.results }}
          RESULTS_EOF
          echo "Ingesting ${{ github.event.inputs.suite }} results from ${{ github.event.inputs.runner }}"
          echo "SHA: ${{ github.event.inputs.sha || 'not specified' }}"
          python3 -c "
          import json, sys
          from scripts.profile_pipeline import benchmark_comparison_projection
          try:
              submitted = json.load(open('tests/benchmark-results.json'))
              projection = benchmark_comparison_projection(submitted)
              result_count = len(projection)
          except (ValueError, KeyError, TypeError, json.JSONDecodeError) as error:
              print(f'Invalid benchmark reproduction metadata: {error}', file=sys.stderr)
              sys.exit(1)
          open('tests/benchmark-results.json', 'w').write(json.dumps(projection, indent=2))
          print(f'Prepared {result_count} comparison entries')
          "

      - name: Restore benchmark cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./cache
          key: benchmark-${{ github.event.inputs.runner }}-main-
          restore-keys: |
            benchmark-${{ github.event.inputs.runner }}-main-

      - name: Count comparable baseline runs
        id: baseline-count
        run: |
          python3 -c "
          import json
          from scripts.profile_pipeline import count_comparable_baselines
          try:
              data = json.load(open('./cache/benchmark-data.json'))
              current = json.load(open('tests/benchmark-results.json'))
              count = count_comparable_baselines(data, current)
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              count = 0
          open('$GITHUB_OUTPUT', 'a').write(f'count={count}\\nready={str(count >= 10).lower()}\\n')
          print(f'Comparable baseline runs: {count}; blocking alerts: {count >= 10}')
          "

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1
        with:
          tool: customSmallerIsBetter
          output-file-path: tests/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: "150%"
          fail-on-alert: ${{ steps.baseline-count.outputs.ready == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save benchmark cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./cache
          key: benchmark-${{ github.event.inputs.runner }}-main-${{ github.run_id }}
