# CLI batch jobs. Optional: uncomment `- job.yaml` in kustomization.yaml or
# `kubectl apply -f job.yaml`.
#
# The jobs share the two PVCs with the Deployment. With ReadWriteOnce storage a
# job pod can only start on the node that already has the volumes mounted, so
# either use ReadWriteMany storage or scale the Deployment to 0 first. If you
# only want scheduled memories, prefer the in-process daily timer instead
# (IMMICH_MEMORIES_AUTOMATION__ENABLED=true on the Deployment) — no job needed.
#
# CPU by default. For GPU nodes add the fields from ../overlays/gpu/deployment-gpu.yaml
# (runtimeClassName, nvidia.com/gpu resources, nodeSelector, tolerations, NVIDIA_* env).
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-memories-generate
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: batch-job
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-memories
        app.kubernetes.io/component: batch-job
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: generate
          image: ghcr.io/sam-dumont/immich-video-memory-generator:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Example: 10-minute 2024 spotlight for one person. --duration is seconds.
          command:
            - immich-memories
            - generate
            - --year
            - "2024"
            - --person
            - "Alice"
            - --duration
            - "600"
            - --output
            - /app/output/alice_2024_memories.mp4

          envFrom:
            - secretRef:
                name: immich-memories-secrets
          env:
            - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
              value: /app/output

          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "16Gi"
              cpu: "8000m"

          volumeMounts:
            - name: data
              mountPath: /home/immich/.immich-memories
            - name: output
              mountPath: /app/output
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-memories-cache
        - name: output
          persistentVolumeClaim:
            claimName: immich-memories-output
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
# CronJob: last month's highlights, 5 minutes, on the 1st of each month.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-memories-monthly
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 2 1 * *"  # 2 AM on the 1st of each month
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-memories
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: generate
              image: ghcr.io/sam-dumont/immich-video-memory-generator:latest

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              command:
                - /bin/sh
                - -c
                - |
                  LAST_MONTH=$(date -d "last month" +%Y-%m-01)
                  THIS_MONTH=$(date +%Y-%m-01)
                  immich-memories generate \
                    --start "$LAST_MONTH" \
                    --end "$THIS_MONTH" \
                    --duration 300 \
                    --output "/app/output/monthly_$(date -d 'last month' +%Y_%m).mp4"

              envFrom:
                - secretRef:
                    name: immich-memories-secrets
              env:
                - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
                  value: /app/output

              resources:
                requests:
                  memory: "4Gi"
                  cpu: "2000m"
                limits:
                  memory: "16Gi"
                  cpu: "8000m"

              volumeMounts:
                - name: data
                  mountPath: /home/immich/.immich-memories
                - name: output
                  mountPath: /app/output
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-memories-cache
            - name: output
              persistentVolumeClaim:
                claimName: immich-memories-output
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
---
# CronJob: smart automation. `auto run` picks the best candidate (monthly,
# yearly, trip, person spotlight...), skips duplicates and respects cooldown.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-memories-auto
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: cronjob-auto
spec:
  schedule: "0 9 * * *"  # Daily at 9 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-memories
            app.kubernetes.io/component: cronjob-auto
        spec:
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: auto-run
              image: ghcr.io/sam-dumont/immich-video-memory-generator:latest

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              command:
                - immich-memories
                - auto
                - run
                - --quiet
                - --cooldown
                - "24"

              envFrom:
                - secretRef:
                    name: immich-memories-secrets
              env:
                - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
                  value: /app/output

              resources:
                requests:
                  memory: "4Gi"
                  cpu: "2000m"
                limits:
                  memory: "16Gi"
                  cpu: "8000m"

              volumeMounts:
                - name: data
                  mountPath: /home/immich/.immich-memories
                - name: output
                  mountPath: /app/output
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-memories-cache
            - name: output
              persistentVolumeClaim:
                claimName: immich-memories-output
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
