name: Release

on:
  # A merge prepares the next release; the owner chooses when to publish it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      force_version:
        description: 'Force version bump type (optional)'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      inference_only:
        description: 'Build and push only the inference images, tagged by commit'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Version calculation and publication must not overlap another release.
concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine if a release is needed based on commits AND branch names
  analyze:
    name: Analyze Commits & Branches
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'sam-dumont/immich-video-memory-generator' &&
      (github.ref == 'refs/heads/main' || inputs.dry_run || inputs.inference_only)
    outputs:
      should_release: ${{ steps.analyze.outputs.should_release }}
      next_version: ${{ steps.analyze.outputs.next_version }}
      release_type: ${{ steps.analyze.outputs.release_type }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Analyze commits and merged branches
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_VERSION: ${{ inputs.force_version }}
          INFERENCE_ONLY: ${{ inputs.inference_only }}
        run: |
          if [[ "$INFERENCE_ONLY" == "true" ]]; then
            python3 scripts/release_analyze.py --inference-only >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release_analyze.py --force-version "${FORCE_VERSION:-auto}" >> "$GITHUB_OUTPUT"
          fi

  # Run CI before release
  ci:
    name: CI
    needs: [analyze]
    if: needs.analyze.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  # Publish only after the tested app image is available under its release tag.
  release:
    name: Create Release
    needs: [analyze, ci, docker-manifest]
    if: >-
      !cancelled() && needs.analyze.outputs.should_release == 'true' &&
      needs.ci.result == 'success' &&
      (inputs.dry_run || needs.docker-manifest.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance: the OIDC token is what identifies this workflow to
      # Sigstore, and attestations is where the signed statement is filed.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build package
        env:
          # The tag is not pushed until this succeeds; pin the candidate version.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: uv build

      - name: Show built version
        run: |
          echo "Built packages:"
          ls -la dist/
          unzip -p dist/*.whl '*/METADATA' | grep '^Version:'

      - name: Attest build provenance
        id: attest
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Stage the attestation as release assets
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          set -euo pipefail
          # WHY not dist/: the pypi-publish job hands the whole directory to
          # twine, which rejects anything that is not a wheel or an sdist.
          mkdir -p attestations
          base="attestations/immich_memories-${NEXT_VERSION}"

          # The Sigstore bundle is what `gh attestation verify --bundle` reads.
          cp "$BUNDLE" "${base}.sigstore.json"

          # The same statement as a bare DSSE envelope. SLSA consumers -- and
          # OpenSSF Scorecard's provenance probe, which matches on the name
          # alone -- expect provenance under .intoto.jsonl. -e fails the step
          # if the bundle ever stops carrying an envelope.
          jq -ce '.dsseEnvelope' "$BUNDLE" > "${base}.intoto.jsonl"

          ls -la attestations/

      - name: Generate changelog
        id: changelog
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            # Group commits by type
            echo "### Features" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> release_notes.md || true
            echo "" >> release_notes.md

            echo "### Bug Fixes" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --grep="^fix" >> release_notes.md || true
            echo "" >> release_notes.md

            echo "### Other Changes" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --grep="^feat" --grep="^fix" --invert-grep >> release_notes.md || true

            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$NEXT_VERSION" >> release_notes.md
          else
            # First release - list all commits
            echo "### Initial Release" >> release_notes.md
            git log --pretty=format:"- %s (%h)" >> release_notes.md || true
            echo "" >> release_notes.md
          fi

      # The tag goes out only after every fallible pre-publication step has
      # succeeded (#1010): a stranded tag must stay a resume signal, not the
      # only evidence that a release completed.
      - name: Push release tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          if git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; then
            # Resuming an interrupted release finds the tag already in place;
            # that is expected and idempotent. A tag that already has a GitHub
            # Release is a genuine double-publication and stays an error.
            if gh release view "v$NEXT_VERSION" --json tagName >/dev/null 2>&1; then
              echo "::error::Tag v$NEXT_VERSION already exists and is published!"
              echo "Existing tags:"
              git tag --list 'v*' --sort=-version:refname | head -5
              exit 1
            fi
            echo "Tag v$NEXT_VERSION already exists with no release; resuming the interrupted publication"
          else
            git tag -a "v$NEXT_VERSION" -m "Release v$NEXT_VERSION"
            git push origin "v$NEXT_VERSION"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: v${{ needs.analyze.outputs.next_version }}
          name: v${{ needs.analyze.outputs.next_version }}
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            attestations/*.sigstore.json
            attestations/*.intoto.jsonl
          draft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist-release
          path: dist/

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          echo "## Release v$NEXT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published packages:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Would release version: **v${{ needs.analyze.outputs.next_version }}**" >> $GITHUB_STEP_SUMMARY
          echo "Release type: **${{ needs.analyze.outputs.release_type }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built packages:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY

  # Publish to PyPI using Trusted Publishers (OIDC — no API tokens needed)
  pypi-publish:
    name: Publish to PyPI
    needs: [analyze, release, pypi-publish-music]
    if: ${{ !inputs.dry_run && needs.analyze.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/immich-memories/
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-release
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14

  # The bundled-music package is versioned by hand and rarely changes, so
  # skip-existing makes a release that does not bump it a no-op rather than a
  # failure. It publishes before the main wheel so that, once `all` requires it
  # again, the dependency is on the index before anything can ask for it.
  pypi-publish-music:
    name: Publish bundled music to PyPI
    needs: [analyze, release]
    if: ${{ !inputs.dry_run && needs.analyze.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/immich-memories-music/
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Build the bundled-music distribution
        run: uv build --out-dir dist-music packages/immich-memories-music

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        with:
          packages-dir: dist-music
          skip-existing: true

  # Deploy docs after release (GITHUB_TOKEN events don't trigger other workflows,
  # so we call the docs workflow directly instead of relying on release:published)
  deploy-docs:
    name: Deploy Docs
    needs: [analyze, release]
    if: ${{ !inputs.dry_run && needs.analyze.outputs.should_release == 'true' }}
    uses: ./.github/workflows/docs.yml
    with:
      version: v${{ needs.analyze.outputs.next_version }}
    permissions:
      contents: read
      pages: write
      id-token: write

  # Build and push Docker images using native runners per platform
  docker-build:
    name: Build Docker Image (${{ matrix.platform }})
    needs: [analyze, ci]
    if: ${{ !inputs.dry_run && needs.analyze.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.runner }}
    # Keep the existing approval before the first registry write.
    environment:
      name: ${{ needs.analyze.outputs.release_type == 'major' && 'production-major' || 'production' }}
    permissions:
      contents: read
      packages: write
      # Same provenance pair as the release job, for the image digest.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.analyze.outputs.next_version }}
            INSTALL_EXTRAS=all
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          # No gha layer cache: it never hit (0 CACHED steps, #1272) and each
          # export pushed the main branch's useful caches out of the 10 GB limit.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true

      # Attaches the attestation to the image in GHCR as an OCI referrer, so
      # `gh attestation verify oci://...` and `cosign` can find it without
      # knowing this repo. Each platform attests its own digest.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # WHY this gate (#346): both 2026-08-18 launch blockers (OpenCV 5 resolving
  # into the image, NVENC selected on GPU-less hosts) were image-only problems
  # the unit suite and native E2E cannot see. One CPU-only generation inside
  # the exact amd64 image, against the hermetic fake Immich, gates the tags.
  inference-build:
    name: Build Inference Image (${{ matrix.device }}, ${{ matrix.platform }})
    needs: [analyze, release]
    # Also runs on a manual dispatch with no release, so a cuda image can be put
    # in front of a real GPU before anyone cuts a version. The tag is then the
    # commit rather than a version, so a test build can never shadow a release.
    if: >-
      !cancelled() && needs.analyze.result == 'success' && !inputs.dry_run &&
      (inputs.inference_only ||
       (needs.release.result == 'success' && needs.analyze.outputs.should_release == 'true'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # cpu ships on both architectures a NAS or a laptop might be; cuda is
        # amd64 only, because the CUDA runtime base this builds on is.
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            device: cpu
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            device: cpu
          - runner: ubuntu-latest
            platform: linux/amd64
            device: cuda

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./docker/Dockerfile.inference
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            DEVICE=${{ matrix.device }}
            APP_VERSION=${{ needs.analyze.outputs.next_version }}
            VCS_REF=${{ github.sha }}
          # No gha layer cache: it never hit (0 CACHED steps, #1272).
          outputs: type=image,name=ghcr.io/${{ github.repository }}/inference,push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: inference-digests-${{ matrix.device }}-${{ strategy.job-index }}
          path: /tmp/digests/*

  inference-manifest:
    name: Create Inference Manifest
    needs: [analyze, inference-build]
    if: >-
      !cancelled() && needs.analyze.result == 'success' &&
      needs.inference-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: /tmp/digests
          pattern: inference-digests-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two manifests, not one: cpu spans both architectures, cuda is a separate
      # tag because a GPU image is a deliberate choice rather than a fallback.
      - name: Create and push manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}/inference
          VERSION: ${{ needs.analyze.outputs.next_version }}
          INFERENCE_ONLY: ${{ inputs.inference_only }}
        run: |
          # A dispatch build has no version to claim, so it is tagged by commit
          # and never moves `latest`. Only a release does that.
          if [ "$INFERENCE_ONLY" = "true" ]; then
            base="sha-${GITHUB_SHA:0:12}"
            cpu_tags="-t $IMAGE:$base"
            cuda_tags="-t $IMAGE:$base-cuda"
          else
            cpu_tags="-t $IMAGE:$VERSION -t $IMAGE:latest"
            cuda_tags="-t $IMAGE:$VERSION-cuda -t $IMAGE:latest-cuda"
          fi
          cpu=$(find /tmp/digests -path '*-cpu-*' -type f -exec basename {} \; | sed "s|^|$IMAGE@sha256:|" | tr '\n' ' ')
          cuda=$(find /tmp/digests -path '*-cuda-*' -type f -exec basename {} \; | sed "s|^|$IMAGE@sha256:|" | tr '\n' ' ')
          docker buildx imagetools create $cpu_tags $cpu
          docker buildx imagetools create $cuda_tags $cuda

  docker-smoke:
    name: Smoke Test Docker Image
    needs: [analyze, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: /tmp/digests
          pattern: digests-amd64
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install "3.12"

      - name: Run one CPU-only generation inside the image
        run: |
          digest="sha256:$(ls /tmp/digests | head -1)"
          image="ghcr.io/${{ github.repository }}@${digest}"
          docker pull "$image"
          uv run --no-project --with pillow --with numpy \
            python scripts/docker_smoke.py --image "$image" --timeout 1200

  # Merge per-platform images into a multi-arch manifest
  docker-manifest:
    name: Create Docker Manifest
    needs: [analyze, docker-build, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  deployment-bundle:
    name: Publish matching deployment manifests
    needs: [analyze, docker-manifest, inference-manifest]
    if: needs.analyze.outputs.should_release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Package and attach deployment files
        env:
          VERSION: ${{ needs.analyze.outputs.next_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle="/tmp/immich-memories-deploy-${VERSION}.tar.gz"
          python3 scripts/package_deployment.py "$VERSION" "$bundle"
          gh release upload "v$VERSION" "$bundle" --clobber
