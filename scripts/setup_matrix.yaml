# The setup matrix (#873): ONE memory, twenty-one setups.
#
# This is not the capability matrix. That one varies what the product is asked
# for (ten memory types, seeds, replays) on one machine. This one varies the
# machine: host lane x reader x where picture facts come from x preparation
# tier, over the SAME month of the SAME library, so the table answers "how do
# the same pictures come out under each mode, and what does each mode cost".
#
# Two env spellings, and they mean different things:
#
#   $env:NAME   resolved by the runner before it executes. For anything the app
#               will not expand itself: a base URL, an ssh destination, a path
#               on the NAS. --dry-run prints the reference, never the value, so
#               a transcript can be pasted into a pull request.
#
#   ${NAME}     written verbatim into the pinned config and expanded by the app
#               at load time. For credentials only: llm.api_key is one of the
#               fields config_loader expands, so the key never lands on disk.
#               The runner passes the variable through to the process, and
#               refuses to start a cell whose credential variable is missing.
#
# `requires_env` names every variable a cell cannot run without. A cell whose
# variables are absent is not dropped: it stays in the table with a skip_reason,
# because a missing lane is a result too.
#
# ISOLATION: every cell banks in an editorial cache of its own, pinned per cell
# by the runner (`cache.directory`, `cache.database`, and the annotation bank
# under them). Nothing derived and nothing decided crosses from one cell to the
# next. The first real Mac run shared one cache and `mac-rules` published the
# model's verdicts as its own losses, with a one-second "cold" preparation on
# top of captions another cell had paid for. Model FILES are the opposite case
# and stay shared, so no detector is downloaded twice: the NAS keeps them in
# $MATRIX_NAS_CACHE at /models and the cluster on the setup-matrix-data claim
# under `models/`, while each cell's cache is its own directory beside its
# output (NAS) or its own subPath of the same claim (cluster).

schema: setup-matrix-v1

# Over a copy of the operator's own config, which is where the Immich
# credentials live. Pinned for every cell so the comparison is the setup and
# nothing else. Music generation is off everywhere: ACE-Step would dominate the
# render time of every row and tell us nothing about the setup.
baseline_config:
  output.resolution: 1080p
  analysis.include_live_photos: true
  ace_step.enabled: false
  musicgen.enabled: false
  # llm.model is deliberately NOT pinned: the operator's config already names
  # the model their local server has resident, and no other cell reads it
  # (`editorial.reader: rules` decides the reader, not a blank model name).
  editorial.reader: rules
  inference.facts_base_url: ""
  inference.fallback_to_local: true
  editorial.preparation.tier: no_captions

  # Where home is, for every lane. `_near_home_test` measures each happening
  # against these two and `worthiness` grades anything over 10 km "away", and
  # the schema's default for both is 0.0. A Mac or NAS cell copies the
  # operator's config and inherits a real home; a cluster cell's ConfigMap is
  # built from the pins ALONE and inherited Null Island, so in run 1 every
  # Brussels happening came out 5,500 km from home and the cluster cells graded
  # the whole month as time away. Measured: each of `mac-rules`,
  # `nas-rules-local` and `nas-rules-service` wrote 22 "No occasion indicator"
  # rows into its memory-worthy gate, and every k8s cell wrote none. The cut
  # differed for a reason no column in the table named.
  #
  # `$env:` and never a literal: coordinates are the owner's home and belong in
  # ~/.immich-memories-matrix/.env, not in a file this repo tracks. The runner
  # refuses to start a run when either variable is missing, so a Null-Island run
  # cannot be started by forgetting one. The demo library wants the same pair:
  # tests/e2e/fake_library.py sets its story in Brussels too (HOME, a public
  # landmark), so one home is right for both libraries.
  trips.homebase_latitude: $env:MATRIX_HOMEBASE_LATITUDE
  trips.homebase_longitude: $env:MATRIX_HOMEBASE_LONGITUDE

  # Every field the timeline plan reads, at the values run 1 was measured with.
  #
  # WHY pinned at all: a Mac or NAS cell copies the operator's config and writes
  # these pins over it, while a cluster cell's ConfigMap is built from the pins
  # ALONE. Anything left out is the operator's value on two lanes and the
  # schema's on the third, and the lanes stop being comparable with nothing in
  # the table saying so. `title_screens.ending_duration` is how that surfaced:
  # 4.0 s in the operator's config against 7.0 s on the schema, and those three
  # seconds of ending screen cost every cluster cell a shot. Not the only reason
  # those rows came out at 14 to everybody else's 15: the homebase pins above are
  # the other half of the same story, and they were found the same way.
  #
  # WHY these values and not the schema's: `mac-local` is the reference cut every
  # other row's overlap is measured against, and it already ran at `locale: fr`
  # and a 4.0 s ending. Pinning the schema's 7.0 s would have made every FUTURE
  # cell plan 14 shots against the reference's 15 and broken the reader
  # comparison the table exists for. These came off
  # `output/setup-matrix/demo/run1/mac-local/config.yaml`. Changing one of them
  # is changing the timeline, and no row measured after it compares with a row
  # measured before it.
  title_screens.enabled: true
  title_screens.locale: fr
  title_screens.style_mode: auto
  title_screens.animated_background: true
  title_screens.show_decorative_lines: false
  title_screens.title_duration: 3.5
  title_screens.month_divider_duration: 2.0
  title_screens.ending_duration: 4.0
  title_screens.show_month_dividers: true
  title_screens.month_divider_threshold: 2
  title_screens.use_first_name_only: true
  # The overlap the plan takes back off the content budget is worked out from
  # these two. There is no `defaults.transition_buffer` on the schema: run 1's
  # config files carry one, left over from a release that had the field.
  defaults.transition: smart
  defaults.transition_duration: 0.5
  # Seconds one photo holds, which is what the editorial plan sizes shots with.
  # Run 1's copied configs named `photos.enabled` and nothing else, so 4.0 is
  # both the schema's default and what those cells ran.
  photos.enabled: true
  photos.duration: 4.0
  # Only read when a memory sizes its own duration, and this manifest asks for
  # 60 s. Pinned anyway: the ConfigMap sees nothing this file does not name.
  analysis.optimal_clip_duration: 5.0

libraries:
  # The public run. tests/e2e/fake_library.py is a stock month (June 2024) that
  # tells a story; `--serve-fixture` puts it on the LAN so the NAS and the
  # cluster can reach it. Nothing here needs anonymising.
  demo:
    month: "2024-06"
    anonymize_required: false
    # Planning envelopes, not measured stage counts. Include room for extra
    # structure reads; revise these when the fixture or selection stages change.
    reader_budget:
      max_seconds: 1200
      max_cost: {EUR: 0.10, USD: 0.20}
      calls:
        episodes: {count: 12, parallel: true}
        period: {count: 4, parallel: false}
        story-pick: {count: 48, parallel: true}
    config:
      immich.url: $env:MATRIX_FIXTURE_BASE_URL
      immich.api_key: fake-immich-api-key
  # The private run. February 2024 of the owner's library, from the pinned
  # config's own Immich credentials. Aggregates only: --anonymize is mandatory
  # before anything from it is published.
  february:
    month: "2024-02"
    anonymize_required: true
    # A conservative 176-call envelope against the observed 156-call run.
    # The breakdown is an estimate using the probe shapes as stage proxies.
    reader_budget:
      max_seconds: 2700
      max_cost: {EUR: 0.25, USD: 0.50}
      calls:
        episodes: {count: 48, parallel: true}
        period: {count: 8, parallel: false}
        story-pick: {count: 80, parallel: true}
    config: {}

# What every cell asks the product for. One memory, same length, same shape.
memory:
  memory_type: monthly_highlights
  duration: 60

# Lanes run against each other. Inside a lane nothing does: a lane is one host,
# and every number this matrix publishes is a timing taken on it.
lanes:
  # The only lane allowed to call oMLX: one machine, one resident model. It
  # kernel-panicked under parallel load on 09-14, so the serial rule is not a
  # preference.
  mac:
    parallel: false
    why: The only lane that may call the local model server.
  nas:
    parallel: false
    why: A DS423+ over ssh, capped at 4 CPUs and 4 GB so the numbers are a NAS.
  k8s:
    parallel: false
    why: A batch Job per cell, and they share one inference service.

cells:
  - id: mac-local
    lane: mac
    reader: local_model
    facts: local
    tier: full
    why: The reference cut. Everything else is measured against this one.
    requires_env: [MATRIX_OMLX_BASE_URL, MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MATRIX_OMLX_BASE_URL
      # oMLX wants a bearer token. OPENAI_API_KEY is the alias config_loader
      # already maps to llm.api_key, and it is the one the owner's shell exports.
      llm.api_key: ${OPENAI_API_KEY}
      # Tier full demands a caption per picture, and the caption endpoint is
      # its own setting: whichever OpenAI-compatible server holds smolvlm2-500m.
      # On this Mac that is oMLX, which hosts it beside the reader; elsewhere it
      # is the inference service on localhost:8092, or a remote one.
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      # Sent to the caption endpoint and nowhere else.
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}
      # Four, against the shipped default of one. One is for a CPU captioner,
      # where four image encodes share the threads of one. This endpoint is an
      # MLX server on this Mac's GPU, and four at once is worth about 1.5x.
      editorial.preparation.caption_concurrency: 4

  - id: mac-rules
    lane: mac
    reader: rules
    facts: local
    tier: full
    why: The same machine and the same facts with no editorial model at all.
    requires_env: [MATRIX_CAPTION_BASE_URL]
    config:
      editorial.reader: rules
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      # Sent to the caption endpoint and nowhere else.
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}
      # Four, against the shipped default of one. One is for a CPU captioner,
      # where four image encodes share the threads of one. This endpoint is an
      # MLX server on this Mac's GPU, and four at once is worth about 1.5x.
      editorial.preparation.caption_concurrency: 4

  # The reader bake-off (#928). Mac cells that differ from `mac-local` in one
  # thing: who reads. Same lane, same tier full, the same caption endpoint and the
  # same banked annotations, so a difference in the cut is a difference in the
  # reader and not in what the reader was handed.
  #
  # Four of them read off Melious. The reader is text only: pictures are read once,
  # at ingest, by the caption model and the heads, and nothing at film time sends
  # the reader a tile. It wants a 32k context, because most of what it is handed
  # is annotation lines. Two of the four carry weights anybody can download and
  # serve, which is the whole point: what somebody who hosts their own gets out of
  # a cheap model.
  #
  # The ids below are what `GET $MELIOUS_AI_BASE_URL/models` answers with, not the
  # slug the model page is served at: the Muse Glimmer 30B page lives at
  # /hub/models/muse-glimmer-30b and its API id is `muse-glimmer`.
  #
  # All four reason on every call whether or not anybody asked, and bill that
  # thinking inside `max_tokens`, which is why run 1's reads came back HTTP 200
  # with content "". `llm.always_reasons: true` funds it from the first call
  # instead of paying for one empty answer per endpoint to learn the same thing.
  # Measured 2026-09-14 on the demo month's 17 KB episode read, asked for the
  # cheapest reasoning on offer: glm-5.3-flash 245 thinking tokens, gemma-4-31b
  # 4,126, deepseek-v4.1-flash 6,256, muse-glimmer 13,469.
  #
  # None of them prepares. Preparation is a fact about the host, the tier and
  # where the picture facts come from, and `mac-local` already measures it for
  # this combination, so `seed_cache_from` copies its bank in and empties every
  # table in it that holds a model's answer. The per-cell cache rule is unbroken:
  # what crosses is captions, heads, pixel facts and motion, and no verdict.
  - id: mac-hosted-melious-deepseek-v4.1-flash
    lane: mac
    seed_cache_from: mac-local
    reader: hosted_melious
    facts: local
    tier: full
    why: "The cheap end of a very large model. MIT weights, 552B with 8B to 16B active, so it is downloadable and on nobody's desk."
    requires_env:
      [MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY, MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: deepseek-v4.1-flash
      llm.api_key: ${MELIOUS_AI_KEY}
      llm.always_reasons: true
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  - id: mac-hosted-melious-gemma-4-31b
    lane: mac
    seed_cache_from: mac-local
    reader: hosted_melious
    facts: local
    tier: full
    why: "Apache 2.0 weights, 31B dense, the one here a workstation can hold. The mac-local-alt cells can run the same weights locally."
    requires_env:
      [MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY, MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: gemma-4-31b
      llm.api_key: ${MELIOUS_AI_KEY}
      llm.always_reasons: true
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  - id: mac-hosted-melious-muse-glimmer-30b
    lane: mac
    seed_cache_from: mac-local
    reader: hosted_melious
    facts: local
    tier: full
    why: "Apache 2.0 weights, 29.6B dense with a 1.8B perception encoder, self-hostable. Its API id is muse-glimmer, which is not the page slug."
    requires_env:
      [MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY, MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: muse-glimmer
      llm.api_key: ${MELIOUS_AI_KEY}
      llm.always_reasons: true
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  - id: mac-hosted-melious-glm-5.3-flash
    lane: mac
    seed_cache_from: mac-local
    reader: hosted_melious
    facts: local
    tier: full
    why: "The zai cells' model bought from the other shop, so the provider and the model stop being one variable. MIT weights, 320B with 18B active."
    requires_env:
      [MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY, MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: glm-5.3-flash
      llm.api_key: ${MELIOUS_AI_KEY}
      llm.always_reasons: true
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  # Two OpenAI cells, to put a name everybody knows next to the cheap ones. The
  # reader calls need `OPENAI_KEY`, the real platform key in the matrix env file.
  # That is NOT `OPENAI_API_KEY`, which is the bearer token the operator's own
  # oMLX wants and is still what pays for the captions in these two cells.
  #
  # Luna is the ballpark match, at $0.20/$1.20 against the Melious picks' EUR
  # 0.10-0.20 in and 0.30-1.00 out. Terra is ten times Luna, and it is in the
  # table to answer "what does paying more buy" rather than as a cheap pick. Sol
  # at $4.00/$20.00 and gpt-6-astra at $10.00/$50.00 are not in the comparison at
  # all. Both of these hold 1,050,000 tokens and take pictures.
  #
  # The account behind OPENAI_KEY holds single-digit dollars, so run Luna first
  # and read `est_cost` off its row before pointing Terra at a real month: Terra
  # is ten times the price on input and ten times on output.
  - id: mac-hosted-openai-luna
    lane: mac
    seed_cache_from: mac-local
    reader: hosted_openai
    facts: local
    tier: full
    why: The cheap end of a name everybody knows, at the price the Melious picks charge.
    requires_env:
      [MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY, OPENAI_KEY]
    config:
      editorial.reader: model
      # The preset owns the base URL: api.openai.com is not a thing a cell should
      # be able to get wrong, and the hosted drop hands the field back to it.
      llm.provider: openai
      llm.model: gpt-5.6-luna
      llm.api_key: ${OPENAI_KEY}
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  - id: mac-hosted-openai-terra
    lane: mac
    seed_cache_from: mac-local
    reader: hosted_openai
    facts: local
    tier: full
    why: "Ten times Luna's price, on the same pictures: the row that says what that buys."
    requires_env:
      [MATRIX_CAPTION_BASE_URL, OPENAI_API_KEY, OPENAI_KEY]
    config:
      editorial.reader: model
      llm.provider: openai
      llm.model: gpt-5.6-terra
      llm.api_key: ${OPENAI_KEY}
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  # The local half of the same question, one cell per model the operator names in
  # MATRIX_MAC_ALT_MODELS (comma separated). The story-first reader needs a
  # vision-capable model with a 32k context: it looks at a few dozen pictures a
  # month as tiles and the rest of what it reads is text, so the context matters
  # more than the vision head and a build that is strong on text may well win.
  #
  # The ids are whatever that Mac has resident, which is the operator's business
  # and not this repo's: unset, the template stays in the table and skips for its
  # own variable.
  - id: mac-local-alt
    lane: mac
    reader: local_model
    facts: local
    tier: full
    seed_cache_from: mac-local
    for_each_env: MATRIX_MAC_ALT_MODELS
    why: A second model on the operator's own server, against the reader mac-local uses.
    requires_env:
      [MATRIX_OMLX_BASE_URL, MATRIX_CAPTION_BASE_URL, MATRIX_MAC_ALT_MODELS, OPENAI_API_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MATRIX_OMLX_BASE_URL
      llm.api_key: ${OPENAI_API_KEY}
      editorial.preparation.caption_base_url: $env:MATRIX_CAPTION_BASE_URL
      editorial.preparation.caption_api_key: ${OPENAI_API_KEY}

  # Every NAS cell below runs under MATRIX_NAS_DOCKER_LIMITS, which defaults to
  # `--cpus 4 --memory 4g`. A kernel with no CFS bandwidth controller (a Synology
  # on cgroup v1) refuses --cpus outright with "NanoCPUs can not be set"; set the
  # variable to `--cpuset-cpus 0-3 --memory 4g` there to pin the same four cores.
  - id: nas-rules-local
    lane: nas
    reader: rules
    facts: local
    tier: no_captions
    # no_captions, not metadata_only: this cell exists to measure what running
    # the ONNX encoder and the two detectors in process costs a 4 GB NAS.
    # metadata_only would ask for no facts at all and measure nothing.
    why: The shipped NAS default. Four cores, four gigabytes, no model anywhere.
    requires_env: [MATRIX_NAS_SSH, MATRIX_NAS_DOCKER, MATRIX_NAS_CACHE, MATRIX_NAS_OUT]

  - id: nas-rules-service
    lane: nas
    reader: rules
    facts: service
    tier: no_captions
    why: The same NAS with the classifiers moved off it. Isolates what they cost.
    requires_env: [MATRIX_NAS_SSH, MATRIX_NAS_DOCKER, MATRIX_NAS_CACHE, MATRIX_NAS_OUT]
    config:
      # Not a variable anyone sets. A NAS is outside the cluster, so the runner
      # applies the inference-lan overlay, waits for the LoadBalancer address and
      # writes `http://<that>:8092` here. Setting MATRIX_INFERENCE_BASE_URL pins
      # it instead, which is the way to point at a service the matrix did not
      # start. No address is ever committed.
      inference.facts_base_url: $env:MATRIX_INFERENCE_BASE_URL
      # Pinned false on every service cell. With the fallback on, an unreachable
      # service is answered by the in-process producers and the row reports a
      # time for a setup that never ran.
      inference.fallback_to_local: false

  - id: nas-hosted-melious
    lane: nas
    reader: hosted_melious
    facts: service
    tier: no_captions
    why: A NAS that pays for judgement instead of running it, on the cheapest hosted pick.
    requires_env:
      [MATRIX_NAS_SSH, MATRIX_NAS_DOCKER, MATRIX_NAS_CACHE, MATRIX_NAS_OUT,
       MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: gemma-4-31b
      llm.api_key: ${MELIOUS_AI_KEY}
      inference.facts_base_url: $env:MATRIX_INFERENCE_BASE_URL
      inference.fallback_to_local: false

  - id: nas-hosted-zai
    lane: nas
    reader: hosted_zai
    facts: service
    tier: no_captions
    why: The second hosted reader, to tell a provider result from a hosted one.
    requires_env:
      [MATRIX_NAS_SSH, MATRIX_NAS_DOCKER, MATRIX_NAS_CACHE, MATRIX_NAS_OUT,
       ZAI_API_KEY, ZAI_BASE_URL]
    config:
      editorial.reader: model
      # base_url is pinned to ZAI_BASE_URL, which names z.ai's Anthropic-
      # compatible endpoint. The account behind ZAI_API_KEY is a coding plan,
      # and a coding plan is served there and nowhere else: the preset's own
      # `…/api/paas/v4` answers it 429 `{"code":"1113","msg":"Insufficient
      # balance"}` no matter what the request says. `provider: zai` routes on
      # the base URL's path, so a `/api/anthropic` base takes the /v1/messages
      # adapter. The hosted-cell drop of llm.base_url is a default for cells
      # that want the preset's URL; a cell naming its own still gets it.
      llm.provider: zai
      llm.base_url: $env:ZAI_BASE_URL
      llm.model: glm-5.3-flash
      llm.api_key: ${ZAI_API_KEY}
      inference.facts_base_url: $env:MATRIX_INFERENCE_BASE_URL
      inference.fallback_to_local: false

  - id: k8s-rules-service
    lane: k8s
    reader: rules
    facts: service
    tier: no_captions
    why: "The cluster with no model bill at all: rules, and classifiers on a GPU."
    requires_env: [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE]
    inference_overlay: true
    config:
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false

  - id: k8s-hosted-melious
    lane: k8s
    reader: hosted_melious
    facts: service
    tier: no_captions
    why: The same cluster job with a hosted reader over the top.
    requires_env: [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE, MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    inference_overlay: true
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: gemma-4-31b
      llm.api_key: ${MELIOUS_AI_KEY}
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false

  - id: k8s-hosted-zai
    lane: k8s
    reader: hosted_zai
    facts: service
    tier: no_captions
    why: "The cheapest published setup: nothing local but the encode."
    requires_env:
      [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE, ZAI_API_KEY, ZAI_BASE_URL]
    inference_overlay: true
    config:
      editorial.reader: model
      # base_url pinned to the Anthropic route, for the reason `nas-hosted-zai`
      # gives above: the coding plan is served there and nowhere else.
      llm.provider: zai
      llm.base_url: $env:ZAI_BASE_URL
      llm.model: glm-5.3-flash
      llm.api_key: ${ZAI_API_KEY}
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false

  - id: k8s-rules-local
    lane: k8s
    reader: rules
    facts: local
    tier: no_captions
    why: One pod doing everything, to price the inference service against itself.
    requires_env: [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE]

  # The two GPU render cells. Everything above encodes on a CPU, so the table has
  # no answer to "when do you need a GPU" and none to "which card". These two are
  # `k8s-rules-service` with the render moved onto a named card: same reader, same
  # facts, same tier, same CPU request, so the only difference between the three
  # rows is what encoded the film.
  #
  # `k8s.gpu_product` is the node label the GPU operator writes, and it is what
  # the Job selects on. A hostname would pin the same machine today and the wrong
  # card the day a GPU moves, and it would put somebody's host in a transcript.
  - id: k8s-gpu-t1000
    lane: k8s
    reader: rules
    facts: service
    tier: no_captions
    why: The same cluster job with the render on a T1000, which is the small card.
    requires_env: [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE]
    inference_overlay: true
    k8s:
      gpu_product: NVIDIA-T1000-8GB-SHARED
      # One CPU, not the default two. The encode is on the card and the pod
      # only feeds it, and the node holding a card also runs the live web
      # Deployment: `k8s-gpu-1070` sat in FailedScheduling for
      # `1 Insufficient cpu` against a default request it never used.
      cpu_request: "1000m"
      # No countable GPU. The inference Deployment holds this node's one
      # allocatable card and the plugin advertises exactly one however the
      # SHARED label reads, so asking makes the pod Pending forever. The plain
      # demo Jobs drew their titles on CUDA here having asked for nothing: the
      # node's runtime exposes the card, and runtimeClassName plus the nodeSelector
      # is what actually puts the render on it.
      gpu_resource: false
    config:
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false
      # Pinned, not detected. Detection takes the first backend that can encode,
      # and a pod whose driver capabilities came up short would encode in software
      # and publish it as a GPU row. Named, the miss is a warning in the log and
      # the row can be thrown out instead of believed.
      hardware.backend: nvidia

  - id: k8s-gpu-1070
    lane: k8s
    reader: rules
    facts: service
    tier: no_captions
    why: The same render on a GTX 1070, to tell a card apart from a GPU.
    requires_env: [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE]
    inference_overlay: true
    k8s:
      gpu_product: NVIDIA-GeForce-GTX-1070-SHARED
      # The card is on a node in another zone, and the cluster's default class
      # provisions volumes with a node affinity of its own. This cell sat in
      # FailedScheduling for "1 node(s) didn't match PersistentVolume's node
      # affinity ... 4 node(s) didn't match Pod's node affinity/selector": no
      # request the pod can make fixes that, because it is the storage that
      # cannot follow the pod. The owner decides which class to lend — one that
      # every node can reach — and names it in the environment, because a class
      # is a fact about somebody's cluster and not about this repo. Unset, the
      # cell is skipped with that variable named rather than run into the same
      # wall on the default class.
      storage_class: $env:MATRIX_K8S_1070_STORAGE_CLASS
      # Its own data and output claims. The shared pair is already bound under
      # the default class, on volumes pinned to the other zone, and a class is
      # not something `apply` can change on a claim that is bound.
      claim_mode: own
      # One CPU, not the default two. The encode is on the card and the pod
      # only feeds it, and the node holding a card also runs the live web
      # Deployment: `k8s-gpu-1070` sat in FailedScheduling for
      # `1 Insufficient cpu` against a default request it never used.
      cpu_request: "1000m"
      # No countable GPU. The inference Deployment holds this node's one
      # allocatable card and the plugin advertises exactly one however the
      # SHARED label reads, so asking makes the pod Pending forever. The plain
      # demo Jobs drew their titles on CUDA here having asked for nothing: the
      # node's runtime exposes the card, and runtimeClassName plus the nodeSelector
      # is what actually puts the render on it.
      gpu_resource: false
    config:
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false
      hardware.backend: nvidia

  # Tier full in the cluster. Both cells want a caption per picture, and what
  # serves them is the captioner overlay: llama.cpp behind a `captioner` Service
  # on 8092, which is where the URL below comes from. `requires_overlay` is the
  # contract either way -- the runner applies that overlay before the cells that
  # named it and tears it down with the inference one, and a checkout that does
  # not carry the directory skips the cell with a reason rather than dropping the
  # row.
  - id: k8s-full-rules
    lane: k8s
    reader: rules
    facts: service
    tier: full
    why: What captioning every picture costs a cluster, with no editorial model.
    requires_env: [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE]
    inference_overlay: true
    requires_overlay: deploy/kubernetes/overlays/captioner
    config:
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false
      # In-cluster DNS, the way the facts URL is. Nothing outside the cluster
      # calls this one, so no address is derived and none is written down.
      editorial.preparation.caption_base_url: http://captioner:8092/v1

  - id: k8s-full-melious
    lane: k8s
    reader: hosted_melious
    facts: service
    tier: full
    why: The full tier with a hosted reader, which is `mac-local` without the Mac.
    requires_env:
      [MATRIX_K8S_CONTEXT, MATRIX_K8S_NAMESPACE, MELIOUS_AI_BASE_URL, MELIOUS_AI_KEY]
    inference_overlay: true
    requires_overlay: deploy/kubernetes/overlays/captioner
    config:
      editorial.reader: model
      llm.provider: openai-compatible
      llm.base_url: $env:MELIOUS_AI_BASE_URL
      llm.model: gemma-4-31b
      llm.api_key: ${MELIOUS_AI_KEY}
      inference.facts_base_url: http://inference:8092
      inference.fallback_to_local: false
      editorial.preparation.caption_base_url: http://captioner:8092/v1
# What a hosted reader's tokens cost at list price, read off the model pages on
# the date each row names. A figure here is a price list and not a bill: the
# summary multiplies it by the tokens the run measured and publishes the product
# as an estimate, labelled as one. Nothing in the matrix asks a provider what a
# completion cost, because no provider in it answers.
#
# Each shop is priced in the currency it publishes in, and nothing here converts
# between them: a rate is a number nobody measured, and a table that quietly
# applied one would be inventing the very figure it is meant to report.
#
# Keyed by reader as well as model id, because `glm-5.3-flash` is sold by two
# shops at two prices and the row has to know which one it bought from. A reader
# with no table here (`hosted_zai`) prices nothing, and its cells keep saying so
# under `unmeasured`.
pricing:
  hosted_melious:
    currency: EUR
    deepseek-v4.1-flash:
      input_per_million: 0.20
      output_per_million: 1.00
      source: https://melious.ai/hub/models/deepseek-v4.1-flash
      retrieved: "2026-09-14"
    gemma-4-31b:
      input_per_million: 0.10
      output_per_million: 0.30
      source: https://melious.ai/hub/models/gemma-4-31b
      retrieved: "2026-09-14"
    muse-glimmer:
      input_per_million: 0.20
      output_per_million: 1.00
      source: https://melious.ai/hub/models/muse-glimmer-30b
      retrieved: "2026-09-14"
    glm-5.3-flash:
      input_per_million: 0.10
      output_per_million: 0.40
      source: https://melious.ai/hub/models/glm-5.3-flash
      retrieved: "2026-09-14"
  hosted_openai:
    currency: USD
    # The ballpark check the owner asked for. Luna is the one that belongs in a
    # table about cheap readers: at 0.20/1.20 it is the Melious picks' price with
    # a dollar sign on it. Terra is ten times Luna on input and ten times the
    # cheapest Melious pick on output, and it is here to answer "what does paying
    # more actually buy", not as a cheap option. Sol (4.00/20.00) and
    # gpt-6-astra (10.00/50.00) are off the table entirely. Both of these take
    # pictures, which the flagship pricing table gets wrong and the model pages
    # get right: 1,050,000 context, text and image in.
    gpt-5.6-luna:
      input_per_million: 0.20
      output_per_million: 1.20
      source: https://developers.openai.com/api/docs/models/gpt-5.6-luna
      retrieved: "2026-09-14"
    gpt-5.6-terra:
      input_per_million: 2.00
      output_per_million: 12.00
      source: https://developers.openai.com/api/docs/models/gpt-5.6-terra
      retrieved: "2026-09-14"
