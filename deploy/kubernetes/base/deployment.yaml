apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-memories
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories
    app.kubernetes.io/component: web-ui
spec:
  # Single-user, single-replica: workflow state lives in-process.
  replicas: 1
  strategy:
    type: Recreate  # both PVCs are ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-memories
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-memories
    spec:
      # The image runs as `immich`, UID/GID 1000, HOME=/home/immich.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # A fresh models claim is empty, and prepare is where that shows up: the
      # first cut stopped naming three files nobody had been told to fetch. This
      # is the same image running the same `models fetch` a Docker user runs after
      # `up`, writing the pinned encoder, the pinned sensitive-content export and
      # the detector snapshot onto the claim. The guard is what makes a restart
      # free: a claim that already carries all three never goes back out.
      initContainers:
        - name: fetch-models
          image: ghcr.io/sam-dumont/immich-video-memory-generator:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - >
              test -s /models/triage/dinov2-small.onnx
              && test -s /models/detectors/nsfw-marqo-384.onnx
              && test -d /models/huggingface
              || immich-memories models fetch
          env:
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            # `models fetch` loads the config before it downloads anything, and that
            # wants HOME writable; the root filesystem here is not.
            - name: data
              mountPath: /home/immich/.immich-memories
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: immich-memories
          # Tag is set by `images:` in kustomization.yaml
          image: ghcr.io/sam-dumont/immich-video-memory-generator:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            # Sessions now live on the `data` volume, but ~/.cache still
            # needs a writable mount before this can flip to true (#445).
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # IMMICH_URL / IMMICH_API_KEY (and any other secret setting) come from
          # the Secret. Everything else is IMMICH_MEMORIES_<SECTION>__<KEY>.
          envFrom:
            - secretRef:
                name: immich-memories-secrets
          env:
            - name: IMMICH_MEMORIES_OUTPUT__DIRECTORY
              value: /app/output
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__TIER
              value: no_captions
            - name: IMMICH_MEMORIES_TRIAGE__ENCODER
              value: /models/triage/dinov2-small.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__MARQO_ONNX
              value: /models/detectors/nsfw-marqo-384.onnx
            - name: IMMICH_MEMORIES_EDITORIAL__PREPARATION__DETECTOR_CACHE_DIR
              value: /models/huggingface
            # Optional: LLM clip content analysis (any OpenAI-compatible API)
            # - name: IMMICH_MEMORIES_LLM__BASE_URL
            #   value: "http://your-llm.llm.svc.cluster.local:8080/v1"
            # - name: IMMICH_MEMORIES_LLM__MODEL
            #   value: "qwen2.5-vl"
            #   value: "true"
            # Optional: daily automation inside the pod (no CronJob needed)
            # - name: IMMICH_MEMORIES_AUTOMATION__ENABLED
            #   value: "true"
            # - name: IMMICH_MEMORIES_AUTOMATION__DAILY_AT
            #   value: "09:00"
            # - name: TZ
            #   value: "Europe/Brussels"

          # Idle ~100 MB; analysis 2-4 GB; FFmpeg assembly 4-8 GB (more for 4K).
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"

          volumeMounts:
            # config.yaml, cache.db, video cache, projects, automation history
            - name: data
              mountPath: /home/immich/.immich-memories
            - name: output
              mountPath: /app/output
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /health/live  # process is up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 503 until config is present and Immich answers; that keeps the pod
          # out of the Service while Immich is down (port-forward still works).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-memories-cache
        - name: output
          persistentVolumeClaim:
            claimName: immich-memories-output
        - name: models
          persistentVolumeClaim:
            claimName: immich-memories-models
        # FFmpeg intermediates: 2Gi is enough for 1080p, use 8Gi for 4K.
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
