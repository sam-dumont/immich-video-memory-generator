# The real Immich the PR gate talks to (`make test-immich-gate`).
#
# Mirrors Immich's own e2e stack: server, Postgres and Valkey, no machine
# learning container (IMMICH_MACHINE_LEARNING_ENABLED=false). Every image is
# pinned by digest; the Makefile picks the server and Valkey pair for the
# version under test. Postgres and the upload directory live on tmpfs, so a
# `down` leaves no volume behind and every run starts from an empty library.
name: immich-gate

services:
  immich-server:
    image: ${IMMICH_GATE_SERVER_IMAGE:?set by make test-immich-gate}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: "true"
    tmpfs:
      - /data
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    ports:
      - "${IMMICH_GATE_PORT:-2299}:2283"

  redis:
    image: ${IMMICH_GATE_VALKEY_IMAGE:?set by make test-immich-gate}
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 2s
      timeout: 5s
      retries: 30

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immich"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 10s
