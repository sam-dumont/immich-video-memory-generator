name: Docker parity probe (temporary, #1280)

on:
  pull_request:
    paths: [docker/Dockerfile, .github/workflows/docker-parity-probe.yml]

permissions:
  contents: read

jobs:
  gha-cache:
    name: gha layer cache round trip
    runs-on: ubuntu-latest
    if: github.repository == 'sam-dumont/immich-video-memory-generator'
    timeout-minutes: 60
    env:
      SCOPE: probe-1285-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: A. no cache at all (today's CI)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            APP_VERSION=0+gprobe1
            INSTALL_EXTRAS=all
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: B. first build, exporting a mode=max gha cache
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            APP_VERSION=0+gprobe1
            INSTALL_EXTRAS=all
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}
      - name: A code-only commit
        run: echo "# probe" >> src/immich_memories/__init__.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: C. code-only rebuild on a fresh builder, importing and exporting the gha cache
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            APP_VERSION=0+gprobe2
            INSTALL_EXTRAS=all
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: D. code-only rebuild on a fresh builder, importing only
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            APP_VERSION=0+gprobe3
            INSTALL_EXTRAS=all
          cache-from: type=gha,scope=${{ env.SCOPE }}
