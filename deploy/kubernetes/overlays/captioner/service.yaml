# Named `captioner` so the app's setting reads the way the docs write it:
#   caption_base_url: http://captioner:8092/v1
# Across namespaces that is captioner.immich-memories.svc.cluster.local:8092.
apiVersion: v1
kind: Service
metadata:
  name: captioner
  namespace: immich-memories
  labels:
    app.kubernetes.io/name: immich-memories-captioner
    app.kubernetes.io/component: captioner
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8092
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: immich-memories-captioner
