# Hooks without an explicit `stages` run only at pre-commit; the commit-msg stage runs
# only the hooks that ask for it (commitizen, private-terms-commit-msg). Without this,
# installing the commit-msg hook type would run every gate twice per commit.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # ~0.1s — Formatting + linting (Rust, fast)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ~0.1s — Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # Private terms (family names, birth dates, fine GPS, ...). The denylist
  # lives outside the repo -- see scripts/private_terms_gate.py -- so both
  # hooks skip cleanly when no denylist is configured on this machine.
  - repo: local
    hooks:
      - id: private-terms
        name: Private terms (staged diff)
        entry: make privacy-gate
        language: system
        pass_filenames: false
        always_run: true

      - id: private-terms-commit-msg
        name: Private terms (commit message)
        entry: uv run python scripts/private_terms_gate.py --commit-msg
        language: system
        stages: [commit-msg]
        pass_filenames: true

  # ~0.1s — Conventional commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]


  # Local hooks using Makefile targets
  # NOTE: mypy moved from mirrors-mypy to a local hook. That repo runs mypy in an
  # isolated env with three dependencies and --ignore-missing-imports, which is a
  # third opinion disagreeing with `make typecheck` and CI: the flag makes import
  # ignores redundant, so warn_unused_ignores reports them as unused here and as
  # required everywhere else.
  # NOTE: refurb moved from upstream repo to local hook below (uses make refurb
  # to avoid src/ layout duplicate module detection issue)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]

      - id: file-length
        name: File length gate (max 800 lines)
        entry: make file-length
        language: system
        pass_filenames: false
        types: [python]

      - id: refurb
        name: Modernization (refurb)
        entry: make refurb
        language: system
        pass_filenames: false
        types: [python]

      - id: complexity
        name: Complexity gate (Xenon grade C)
        entry: make complexity
        language: system
        pass_filenames: false
        types: [python]

      - id: dead-code
        name: Dead code detection (Vulture)
        entry: make dead-code
        language: system
        pass_filenames: false
        types: [python]

      - id: security-lint
        name: Security lint (Bandit)
        entry: make security-lint
        language: system
        pass_filenames: false
        types: [python]

      - id: cognitive-complexity
        name: Cognitive complexity (complexipy with snapshot)
        entry: make cognitive-complexity
        language: system
        pass_filenames: false
        types: [python]

      - id: dep-check
        name: Dependency hygiene (deptry)
        entry: make dep-check
        language: system
        pass_filenames: false
        types: [python]

      - id: arch-check
        name: Architectural boundaries (import-linter)
        entry: make arch-check
        language: system
        pass_filenames: false
        types: [python]

      - id: duplication
        name: Code duplication (jscpd ≤5%)
        entry: make duplication
        language: system
        pass_filenames: false
        types: [python]


      - id: diff-cover-check
        name: Diff coverage check (≥80% on changed lines)
        entry: make diff-cover-local
        language: system
        pass_filenames: false
        types: [python]

