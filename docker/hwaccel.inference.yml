# Attaching hardware to the inference service, the way immich's hwaccel.ml.yml does.
#
# An overlay for people who have a checkout. docker-compose.yml names no
# `extends:` at all, because it is downloaded on its own far more often than it
# is cloned and compose resolves an `extends:` when the file loads, whatever
# profiles are on: naming this file from there made a lone docker-compose.yml
# fail to parse (#882). It carries the cuda reservation commented out instead.
# From a checkout, add the block to the inference service:
#
#   extends:
#     file: docker/hwaccel.inference.yml
#     service: cuda          # or cpu, which reserves nothing
#
# `cuda` also needs the `-cuda` image: set INFERENCE_TAG=latest-cuda (or
# X.Y.Z-cuda). The cpu image has no CUDA provider in it and will not grow one
# because a device was reserved.
#
# Not shipped: openvino, armnn and rocm. A 12-EU Gemini Lake iGPU is not worth
# the OpenVINO engineering, per-SoC Mali driver binding cannot be tested here,
# and there is no AMD card to test ROCm on.
#
# Quick Sync, VAAPI and NVENC decode, scale and encode. They do not run
# inference — that stays true everywhere in these docs.
services:
  cpu: {}

  cuda:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
